    />

    <!-- Central Smart Network Hub & Sensor Nodes -->
    <!-- Center Node -->
    <circle cx="256" cy="256" r="30" fill="#ffffff" stroke="#006a60" stroke-width="12" />
    <circle cx="256" cy="256" r="12" fill="#5eead4" />

