spec: blueprint/v1
name: campushub-analyst

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    messaging: true

inputs:
  PACK_TOKEN:
    name: PACK_TOKEN
    datatype: string
    secret: true
    description: Bearer token the agent presents to the CampusHub metrics-pack endpoint
  PACK_ENDPOINT:
    name: PACK_ENDPOINT
    datatype: string
    default: https://campushub-2.onrender.com/api/insights/pack
    description: CampusHub metrics-pack endpoint URL

models:
  primary:
    provider: gateway
