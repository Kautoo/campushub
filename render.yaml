# CampusHub 2.0 — Render blueprint
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Secrets are declared with sync:false — set them in the Render dashboard after the first sync.
databases:
  - name: campushub-db
    plan: basic-1gb
    databaseName: campushub
    user: campushub

services:
  - type: web
    name: campushub-2
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && (cp -r public .next/standalone/public 2>/dev/null || mkdir -p .next/standalone/public)
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://campushub-2.onrender.com
      # --- Database (wired from the Render Postgres service above) ---
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString
      # --- Auth.js ---
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # --- PayPal (required for checkout) ---
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_CURRENCY
        value: MYR
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # --- AI gateway (optional; without it insights show setup notice) ---
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: glm-5.3-flash
      # Bearer tokens for machine agents hitting /api/insights/pack (Astropods)
      - key: PACK_API_TOKENS
        sync: false
      # --- Sponsors (optional; features hidden without keys) ---
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ASTROPODS_API_KEY
        sync: false
      - key: BRYNTUM_LICENSE_KEY
        sync: false
